name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: typescript

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.release.tag_name, 'go/v')
    runs-on: ubuntu-latest
    environment: npm
    env:
      GOLEM_POLICY_PG_URL: postgresql://postgres:golem@127.0.0.1:55432/golem
      GOLEM_POLICY_PG_C_URL: postgresql://postgres:golem@127.0.0.1:55433/golem
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: golem
          POSTGRES_DB: golem
          POSTGRES_INITDB_ARGS: --locale=en_US.utf8
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres-c:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: golem
          POSTGRES_DB: golem
          POSTGRES_INITDB_ARGS: --locale=C
        ports:
          - 55433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest
      - name: Install dependencies
        run: |
          npm ci
          # npm 11 defers install scripts until approved, which leaves native
          # modules unbuilt. The queue's integration suite runs against a real
          # SQLite engine and cannot load better-sqlite3 without its binary.
          npm approve-scripts better-sqlite3
          npm rebuild better-sqlite3
      - name: Build libraries
        run: |
          npm run build -w @eleven-am/golem-policy -w @eleven-am/golem-core -w @eleven-am/golem-generator
          npm rebuild -w @eleven-am/golem-generator
          # golem-authorizer resolves @eleven-am/golem-policy from its dist/, which
          # is gitignored, so policy has to be built in the batch above.
          npm run build -w @eleven-am/golem-authorizer -w @eleven-am/golem -w @eleven-am/golem-queue -w @eleven-am/golem-render
      - name: Test libraries
        run: npm run test -w @eleven-am/golem-core -w @eleven-am/golem-policy -w @eleven-am/golem-authorizer -w @eleven-am/golem-generator -w @eleven-am/golem -w @eleven-am/golem-queue -w @eleven-am/golem-render --if-present
      - name: Publish packages in dependency order
        run: |
          publish() {
            name="$1"; dir="$2"
            version="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
            else
              npm publish -w "$name" --access public
            fi
          }
          # golem-core depends on golem-policy, and golem-authorizer on both,
          # so policy publishes first or their installs resolve nothing.
          publish @eleven-am/golem-policy packages/policy
          publish @eleven-am/golem-core packages/core
          publish @eleven-am/golem-generator packages/generator
          publish @eleven-am/golem-authorizer packages/authorizer
          publish @eleven-am/golem packages/nest
          publish @eleven-am/golem-queue packages/queue
          publish @eleven-am/golem-render packages/render
