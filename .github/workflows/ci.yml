name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    env:
      GOLEM_P8_REQUIRE_POSTGRESQL: "1"
      GOLEM_TEST_POSTGRES_DSN: postgresql://postgres:golem@127.0.0.1:55433/golem?sslmode=disable
      GOLEM_TEST_POSTGRES_LINGUISTIC_DSN: postgresql://postgres:golem@127.0.0.1:55432/golem?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: golem
          POSTGRES_DB: golem
          POSTGRES_INITDB_ARGS: --locale=en_US.utf8
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres-c:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: golem
          POSTGRES_DB: golem
          POSTGRES_INITDB_ARGS: --locale=C
        ports:
          - 55433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Verify Go policy kernel
        run: go test -p=1 -count=1 -timeout=30m ./...
      - name: Race-check concurrent Go runtime surfaces
        run: go test -p=1 -race -count=1 -timeout=30m ./events/... ./provider/... ./runtime
      - name: Install PostgreSQL client matching the service version
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version
      - name: Verify documented commands and snippets
        run: >-
          go test -tags=releaseintegration -p=1 -count=1 -timeout=30m ./cmd/golem
          -run '^(TestP8DocumentationCommandCorpus|TestP8QuickstartFromEmptyDirectory|TestP8EveryPublicSnippetTypeChecks|TestP8DeploymentAndRecoveryRunbookDrills)$'
      - name: Vet Go policy kernel
        run: go vet ./...
      - name: Check Go formatting
        run: |
          test -z "$(find . -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          git diff --check

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    env:
      GOLEM_POLICY_PG_URL: postgresql://postgres:golem@127.0.0.1:55432/golem
      GOLEM_POLICY_PG_C_URL: postgresql://postgres:golem@127.0.0.1:55433/golem
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: golem
          POSTGRES_DB: golem
          POSTGRES_INITDB_ARGS: --locale=en_US.utf8
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres-c:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: golem
          POSTGRES_DB: golem
          POSTGRES_INITDB_ARGS: --locale=C
        ports:
          - 55433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      # golem-core imports @eleven-am/golem-policy, whose dist is gitignored, so
      # policy builds first or core cannot resolve it.
      - run: npm run build -w @eleven-am/golem-policy -w @eleven-am/golem-core -w @eleven-am/golem-generator
      - run: npm rebuild -w @eleven-am/golem-generator
      - run: npm run generate -w demo
      - run: npm run push -w demo
      - run: npm run build
      - run: npm test
      - run: npm run benchmark:hardening
      # Audits what consumers actually install. The development tree carries
      # advisories against jest that need a major bump, and Prisma's latest
      # release currently carries unpatched ones of its own, so a moderate gate
      # over everything blocks releases on issues no change here can fix.
      # Tighten this back once those are patched upstream.
      - run: npm audit --omit=dev --audit-level=critical
