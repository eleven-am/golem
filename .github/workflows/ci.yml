name: CI

on:
  push:
    branches: [main]
    tags: ["go/v*"]
  pull_request:
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' || steps.changes.outputs.go == 'true' }}
      typescript: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' || steps.changes.outputs.typescript == 'true' }}
      dependencies: ${{ steps.changes.outputs.dependencies == 'true' }}
      steps: ${{ steps.plan.outputs.steps }}
    steps:
      - uses: actions/checkout@v7
      - id: changes
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - go/**
              - docs/**
              - scripts/verify.sh
              - Makefile
              - .github/workflows/ci.yml
            typescript:
              - typescript/**
              - .github/workflows/ci.yml
            dependencies:
              - go/go.mod
              - go/go.sum
      - id: plan
        run: echo "steps=$(scripts/verify.sh list | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  go:
    name: Go ${{ matrix.step }}
    needs: plan
    if: needs.plan.outputs.go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        step: ${{ fromJSON(needs.plan.outputs.steps) }}
    env:
      GOLEM_TEST_POSTGRES_DSN: postgresql://postgres:golem@127.0.0.1:55433/golem?sslmode=disable
      GOLEM_TEST_POSTGRES_LINGUISTIC_DSN: postgresql://postgres:golem@127.0.0.1:55432/golem?sslmode=disable
      GOLEM_TEST_PGVECTOR_DSN: postgresql://postgres:golem@127.0.0.1:55434/golem?sslmode=disable
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: golem
          POSTGRES_DB: golem
          POSTGRES_INITDB_ARGS: --locale=en_US.utf8
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres-c:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: golem
          POSTGRES_DB: golem
          POSTGRES_INITDB_ARGS: --locale=C
        ports:
          - 55433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      pgvector:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: golem
          POSTGRES_DB: golem
        ports:
          - 55434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: scripts/verify.sh "$STEP"
        env:
          STEP: ${{ matrix.step }}

  vulncheck:
    name: Go vulncheck
    needs: plan
    if: github.event_name != 'pull_request' || needs.plan.outputs.dependencies == 'true'
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summary.outputs.text }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: scripts/verify.sh vulncheck
      - id: summary
        if: always()
        run: |
          {
            echo "text<<GOVULNCHECK_SUMMARY"
            grep -E '^(Vulnerability #|    (Found|Fixed) in:|Your code is affected|No vulnerabilities)' go/bin/verify/vulncheck.log ||
              echo "the scan did not complete; see the run log"
            echo "GOVULNCHECK_SUMMARY"
          } >> "$GITHUB_OUTPUT"

  vulncheck-issue:
    name: Go vulncheck issue
    needs: vulncheck
    if: always() && github.event_name != 'pull_request' && needs.vulncheck.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: "govulncheck: reachable vulnerabilities on main"
      RESULT: ${{ needs.vulncheck.result }}
      SUMMARY: ${{ needs.vulncheck.outputs.summary }}
      REF: ${{ github.ref }}
      EVENT: ${{ github.event_name }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          number="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title \
            --jq '[.[] | select(.title == env.TITLE)][0].number // empty')"
          if [ "$RESULT" = success ]; then
            if [ -n "$number" ] && [ "$REF" = refs/heads/main ]; then
              gh issue close "$number" --comment "govulncheck passed on main: $RUN_URL"
            fi
            exit 0
          fi
          body="$(printf 'govulncheck did not pass on %s (%s event, job result: %s).\n\nRun: %s\n\n```\n%s\n```\n' \
            "$REF" "$EVENT" "$RESULT" "$RUN_URL" "$SUMMARY")"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi

  go-suite:
    name: Go suite
    runs-on: ubuntu-latest
    if: always()
    needs: [plan, go]
    steps:
      - name: Fail if planning or any Go job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in *" failure "* | *" cancelled "*) exit 1 ;; esac

  typescript:
    needs: plan
    if: needs.plan.outputs.typescript == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: typescript
    env:
      GOLEM_POLICY_PG_URL: postgresql://postgres:golem@127.0.0.1:55432/golem
      GOLEM_POLICY_PG_C_URL: postgresql://postgres:golem@127.0.0.1:55433/golem
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: golem
          POSTGRES_DB: golem
          POSTGRES_INITDB_ARGS: --locale=en_US.utf8
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres-c:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: golem
          POSTGRES_DB: golem
          POSTGRES_INITDB_ARGS: --locale=C
        ports:
          - 55433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: typescript/package-lock.json
      - run: npm ci
      # golem-core imports @eleven-am/golem-policy, whose dist is gitignored, so
      # policy builds first or core cannot resolve it.
      - run: npm run build -w @eleven-am/golem-policy -w @eleven-am/golem-core -w @eleven-am/golem-generator
      - run: npm rebuild -w @eleven-am/golem-generator
      - run: npm run generate -w demo
      - run: npm run push -w demo
      - run: npm run build
      - run: npm test
      - run: npm run benchmark:hardening
      # Audits what consumers actually install. The development tree carries
      # advisories against jest that need a major bump, and Prisma's latest
      # release currently carries unpatched ones of its own, so a moderate gate
      # over everything blocks releases on issues no change here can fix.
      # Tighten this back once those are patched upstream.
      - run: npm audit --omit=dev --audit-level=critical
