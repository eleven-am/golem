name: Publish client

on:
  push:
    branches: [main]
    tags: ["client/v*"]
    paths: ["client/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: client

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest
      - name: Both packages carry the same version
        run: |
          core="$(node -p "require('./core/package.json').version")"
          react="$(node -p "require('./react/package.json').version")"
          if [ "$core" != "$react" ]; then
            echo "client/core is $core but client/react is $react" >&2
            exit 1
          fi
      - name: Tag matches both package versions
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#client/v}"
          for dir in core react; do
            actual="$(node -p "require('./$dir/package.json').version")"
            if [ "$actual" != "$version" ]; then
              echo "client/$dir is $actual but the tag is $TAG" >&2
              exit 1
            fi
          done
      - run: npm ci
      - name: No useEffect under client
        run: npm run check:no-use-effect
      - run: npm run build
      - run: npm test
      - name: Publish packages in dependency order
        run: |
          publish() {
            name="$1"
            version="$(node -p "require('./$2/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version already published, skipping"
            else
              npm publish -w "$name" --access public
            fi
          }
          publish @eleven-am/golem-client core
          publish @eleven-am/golem-react react
