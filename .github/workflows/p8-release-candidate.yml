name: Go release

on:
  push:
    tags: ["go/v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: go

env:
  GOLEM_P8_REQUIRE_POSTGRESQL: "1"
  GOLEM_P8_REQUIRE_NATS: "1"
  GOLEM_REQUIRE_PGVECTOR: "1"
  GOLEM_TEST_POSTGRES_DSN: postgresql://postgres:golem@127.0.0.1:55433/golem?sslmode=disable
  GOLEM_TEST_POSTGRES_LINGUISTIC_DSN: postgresql://postgres:golem@127.0.0.1:55432/golem?sslmode=disable
  GOLEM_TEST_PGVECTOR_DSN: postgresql://postgres@127.0.0.1:55434/golem?sslmode=disable
  GOLEM_P8_SOCIAL_POSTGRES_DSN: postgresql://postgres:golem@127.0.0.1:55433/golem?sslmode=disable
  GOLEM_P8_SOCIAL_POSTGRES_LINGUISTIC_DSN: postgresql://postgres:golem@127.0.0.1:55432/golem?sslmode=disable

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      pgvector:
        image: pgvector/pgvector@sha256:7ae6051efd0e60444282c27c7e141af07f322ce033300e727a49c3dd11075e38
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: golem
        ports:
          - 55434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:15@sha256:6eb0add3b77c081df18aa518ce43df58fdcc40f2e6d868a6fd08038dc7acd425
        env:
          POSTGRES_PASSWORD: golem
          POSTGRES_DB: golem
          POSTGRES_INITDB_ARGS: --locale=en_US.utf8
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres-c:
        image: postgres:15@sha256:6eb0add3b77c081df18aa518ce43df58fdcc40f2e6d868a6fd08038dc7acd425
        env:
          POSTGRES_PASSWORD: golem
          POSTGRES_DB: golem
          POSTGRES_INITDB_ARGS: --locale=C
        ports:
          - 55433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Materialize Core NATS
        run: docker image pull nats:2.14.4@sha256:ecf677bae6a0ae7900bd3217be041c6614d5dcd2cae780000f9cd69462b36541
      - name: Test supported product behavior
        run: go test -p=1 -count=1 -timeout=60m ./...
      - name: Test release-only upgrade and documentation journeys
        run: >-
          go test -p=1 -count=1 -timeout=20m -tags=releaseintegration ./cmd/golem
          -run '^(TestP8DocumentationCommandCorpus|TestP8QuickstartFromEmptyDirectory|TestP8EveryPublicSnippetTypeChecks|TestP8DeploymentAndRecoveryRunbookDrills|TestP8ExecutableGoV002ToV010MigrationGuide)$'
      - name: Static checks
        run: |
          go vet ./...
          test -z "$(find . -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          git diff --check
      - name: Clean test-owned NATS
        if: always()
        working-directory: .
        run: |
          if docker container inspect golem-p8-order7-nats >/dev/null 2>&1; then
            docker rm -f golem-p8-order7-nats
          fi

  publish:
    if: startsWith(github.ref, 'refs/tags/go/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Materialize release signer authority
        env:
          ALLOWED_SIGNERS_B64: ${{ secrets.GOLEM_RELEASE_ALLOWED_SIGNERS_B64 }}
          ALLOWED_SIGNERS_SHA256: ${{ secrets.GOLEM_RELEASE_ALLOWED_SIGNERS_SHA256 }}
        run: |
          test -n "${ALLOWED_SIGNERS_B64}"
          test -n "${ALLOWED_SIGNERS_SHA256}"
          printf '%s' "${ALLOWED_SIGNERS_B64}" | base64 --decode > "${RUNNER_TEMP}/golem-release-allowed-signers"
          printf '%s  %s\n' "${ALLOWED_SIGNERS_SHA256}" "${RUNNER_TEMP}/golem-release-allowed-signers" | sha256sum --check --status
      - name: Verify signed tag and build release assets
        env:
          ALLOWED_SIGNERS_SHA256: ${{ secrets.GOLEM_RELEASE_ALLOWED_SIGNERS_SHA256 }}
        run: |
          go run ./internal/cmd/p8release -mode verify -tag "${GITHUB_REF_NAME}" -module . -proxy direct -allowed-signers "${RUNNER_TEMP}/golem-release-allowed-signers" -allowed-signers-sha256 "${ALLOWED_SIGNERS_SHA256}"
          go run ./internal/cmd/p8release -mode build -tag "${GITHUB_REF_NAME}" -module . -allowed-signers "${RUNNER_TEMP}/golem-release-allowed-signers" -allowed-signers-sha256 "${ALLOWED_SIGNERS_SHA256}" -output "${RUNNER_TEMP}/golem-release"
          tar -czf "${RUNNER_TEMP}/golem-release-evidence.tar.gz" -C "${RUNNER_TEMP}/golem-release" .
      - name: Publish immutable GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            "${RUNNER_TEMP}"/golem-release/*.tar.gz \
            "${RUNNER_TEMP}"/golem-release/*.zip \
            "${RUNNER_TEMP}"/golem-release/SHA256SUMS \
            "${RUNNER_TEMP}"/golem-release/release-inventory.json \
            "${RUNNER_TEMP}"/golem-release-evidence.tar.gz \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/golem-release/RELEASE_NOTES.md"
